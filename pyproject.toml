[project]
name = "fastapi-demo"
version = "0.1.0"
description = "Fast API Demo"
readme = "README.md"
authors = [
    { name = "Chamandeswari Kaza", email = "Chamandeswari.Kaza@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.2",
    "scikit-learn==1.6.1",
    "uvicorn>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
